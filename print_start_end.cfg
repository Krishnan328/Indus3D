# ==============================================================================
# Indus3D Pre-Flight PRINT_START & PRINT_END Macros
# ==============================================================================
# PRINT_START
# - Read-only pre-flight REPORT: warns (action_respond_info) when a configured
#   filament_switch_sensor / filament_motion_sensor reports no filament, and
#   notes a missing heated bed or extruder. It never aborts or pauses; what to
#   do about a missing-filament warning is deliberately not decided here.
# - Dual-stage heating (150C standby while probing to avoid drooling)
# - Optional soak, nozzle wipe (NOZZLE_WIPE, if defined)
# - Bed mesh (KAMP adaptive when installed; METHOD=rapid_scan only when
#   KAMP asks for it and the printer config supports it)
# - SMART_PARK, final hotend heat and LINE_PURGE (when KAMP is installed)
# Works without a heated bed.
#
# PRINT_END
# - Heaters and fan are switched off first, before anything that could fail.
# - Retracts only when the extruder is hot enough, moves only when homed, and
#   never moves the toolhead while a bed crash (ESP8266 hub) is latched.
# ==============================================================================

[gcode_macro PRINT_START]
description: Pre-flight report, heating, homing, adaptive meshing and purging
gcode:
    # 1. Capture Slicer Parameters (with robust fallbacks)
    {% set bed_temp = params.BED_TEMP|default(params.BED|default(60))|float %}
    {% set ext_temp = params.EXTRUDER_TEMP|default(params.EXTRUDER|default(200))|float %}
    {% set chamber_min = params.CHAMBER_MIN|default(params.CHAMBER|default(0))|float %}
    {% set soak_mins = params.SOAK_MINS|default(0)|int %}
    {% set has_bed = printer.heater_bed is defined %}
    {% set has_ext = printer.extruder is defined %}
    {% set cf = printer.configfile|default({}) %}
    {% set raw_cfg = cf.config|default({}) %}
    {% set has_kamp = printer["gcode_macro _KAMP_Settings"] is defined %}

    {action_respond_info("Indus3D: Initiating Pre-Flight Sequence (Bed: %.0fC, Extruder: %.0fC)" % (bed_temp, ext_temp))}

    # 2. Pre-flight report (read only, never aborts)
    {% set warnings = [] %}
    {% if not has_bed %}
        {% set _ = warnings.append("no heated bed configured, bed heating skipped") %}
    {% endif %}
    {% if not has_ext %}
        {% set _ = warnings.append("no extruder configured, hotend heating and purge skipped") %}
    {% endif %}
    {% for sec in raw_cfg %}
        {% if sec.startswith("filament_switch_sensor ") or sec.startswith("filament_motion_sensor ") %}
            {% set sensor = printer[sec] %}
            {% if sensor is defined and sensor.filament_detected is defined and not sensor.filament_detected %}
                {% set _ = warnings.append("filament sensor '" ~ sec.split(" ", 1)[1] ~ "' reports NO filament") %}
            {% endif %}
        {% endif %}
    {% endfor %}
    {% if "xyz" not in printer.toolhead.homed_axes %}
        {% set _ = warnings.append("axes are not homed yet, homing as part of the sequence") %}
    {% endif %}
    {% for w in warnings %}
        {action_respond_info("Indus3D pre-flight WARNING: " ~ w)}
    {% endfor %}
    {% if warnings|length == 0 %}
        {action_respond_info("Indus3D pre-flight: heaters and filament sensors OK")}
    {% endif %}

    # 3. Pre-heat bed and standby extruder (150C prevents oozing during probing)
    M117 Pre-heating Bed & Hotend...
    {% if has_bed %}
        M140 S{bed_temp}
    {% endif %}
    {% if has_ext %}
        M104 S{[ext_temp, 150.0]|min}
    {% endif %}

    # 4. Home all axes while heating
    G90
    {% if "xyz" not in printer.toolhead.homed_axes %}
        M117 Homing All Axes...
        G28
    {% endif %}

    # 5. Wait for bed to reach target temperature
    {% if has_bed %}
        M117 Waiting for Bed Temp...
        M190 S{bed_temp}
    {% endif %}

    # 6. Optional chamber soak (if requested by slicer)
    {% if soak_mins > 0 %}
        M117 Chamber Soaking for {soak_mins}m...
        G4 P{soak_mins * 60 * 1000}
    {% endif %}

    # 7. Clean nozzle on brush if macro exists
    {% if printer["gcode_macro NOZZLE_WIPE"] is defined %}
        M117 Wiping Nozzle...
        NOZZLE_WIPE
    {% endif %}

    # 8. Bed mesh. rapid_scan only when KAMP asks for it AND the config supports it
    {% if raw_cfg.bed_mesh is defined %}
        {% set ns = namespace(rapid=False) %}
        {% if has_kamp and (printer["gcode_macro _KAMP_Settings"].probe_method|default("default"))|lower == "rapid_scan" %}
            {% for sec in raw_cfg %}
                {% for p in printer["gcode_macro _KAMP_Settings"].rapid_scan_probes|default([]) %}
                    {% if sec == p or sec.startswith(p ~ " ") %}{% set ns.rapid = True %}{% endif %}
                {% endfor %}
            {% endfor %}
        {% endif %}
        M117 Adaptive Bed Meshing...
        {% if ns.rapid %}
            BED_MESH_CALIBRATE METHOD=rapid_scan
        {% else %}
            BED_MESH_CALIBRATE
        {% endif %}
    {% endif %}

    # 9. Smart park near the first layer (needs KAMP)
    {% if printer["gcode_macro SMART_PARK"] is defined %}
        M117 Smart Parking...
        SMART_PARK
    {% endif %}

    # 10. Heat hotend to final printing temperature
    {% if has_ext %}
        M117 Heating to Print Temp...
        M109 S{ext_temp}
    {% endif %}

    # 11. Adaptive line purge right next to the part (needs KAMP)
    {% if printer["gcode_macro LINE_PURGE"] is defined %}
        M117 Adaptive Line Purge...
        LINE_PURGE
    {% endif %}

    # 12. Print start confirmation
    M117 Printing...
    {action_respond_info("Indus3D: Pre-Flight Complete. Print Started.")}


[gcode_macro PRINT_END]
description: Heaters off first, then safe retract, lift, park and motor release
gcode:
    {% set has_bed = printer.heater_bed is defined %}
    {% set has_ext = printer.extruder is defined %}
    {% set hub = printer["gcode_macro _BED_HUB_VARS"] %}
    {% set crash_latched = hub is defined and hub.crash_active|default(False) %}
    {% set th = printer.toolhead %}
    {% set homed = th.homed_axes %}
    {% set hot = has_ext and printer.extruder.can_extrude|default(False) %}

    # 1. Switch everything off FIRST so a later failure can never leave heaters on.
    #    (The nozzle stays hot for several seconds, so the retract below still works.)
    {% if has_bed %}
        M140 S0
    {% endif %}
    {% if has_ext %}
        M104 S0
    {% endif %}
    {% if printer.fan is defined %}
        M106 S0
    {% endif %}

    {% if crash_latched %}
        # A bed crash is latched and the print is paused for the user: do not move anything.
        {action_respond_info("Indus3D: PRINT_END while a bed crash is latched, heaters off, toolhead NOT moved")}
    {% else %}
        SAVE_GCODE_STATE NAME=_PRINT_END
        G90

        # 2. Retract only when the extruder is hot enough to extrude
        {% if hot %}
            M83
            G1 E-2.5 F3000
        {% endif %}

        # 3. Z lift and park only when the axes are homed
        {% if "z" in homed %}
            {% set max_z = th.axis_maximum.z|float %}
            {% set act_z = th.position.z|float %}
            G1 Z{[act_z + 5.0, max_z] | min} F3000
        {% endif %}
        {% if "x" in homed and "y" in homed %}
            {% set park_x = [[th.axis_minimum.x|float + 10.0, th.axis_minimum.x|float] | max, th.axis_maximum.x|float] | min %}
            {% set park_y = [[th.axis_maximum.y|float - 15.0, th.axis_minimum.y|float] | max, th.axis_maximum.y|float] | min %}
            G1 X{park_x} Y{park_y} F6000
        {% endif %}
        RESTORE_GCODE_STATE NAME=_PRINT_END

        # 4. Clear bed mesh, release X/Y/E motors (Z stays held so the bed does not drop)
        {% if printer.bed_mesh is defined %}
            BED_MESH_CLEAR
        {% endif %}
        M84 X Y E
    {% endif %}

    M117 Print Complete
    {action_respond_info("Indus3D: Print Ended Safely.")}
