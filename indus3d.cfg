# Indus3D Klipper Integration Configuration
# Include this in your printer.cfg: [include indus3d.cfg]

[update_manager indus3d]
type: git_repo
path: ~/Indus3D
origin: https://github.com/Krishnan328/Indus3D.git
primary_branch: main
is_system_service: True
managed_services: indus3d

# Indus3D uses these empty macros to track user actions if they click physical screen buttons.
# They are safely overwritten if you already have them.
[gcode_macro PAUSE_INDUS3D]
description: Pause the print (Indus3D wrapper)
gcode:
    PAUSE

[gcode_macro CANCEL_INDUS3D]
description: Cancel the print (Indus3D wrapper)
gcode:
    CANCEL_PRINT
