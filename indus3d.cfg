# ==============================================================================
# Indus3D Klipper Integration Configuration
# ==============================================================================
# Include this file in your printer.cfg:
#   [include indus3d.cfg]
#
# Note: For Moonraker update manager, add the [update_manager indus3d] section
# to your moonraker.conf, not printer.cfg.
# ==============================================================================

# Enable Exclude Object support for selective cancellation and KAMP
[exclude_object]

# ==============================================================================
# OPTIONAL: KAMP (Klipper Adaptive Meshing & Purging)
# ==============================================================================
# Uncomment the 4 lines below to enable adaptive mesh probing and line purging.
# Mesh bounds come from your own [bed_mesh] config. The default probe method is
# "default"; set variable_probe_method: "rapid_scan" in kamp/KAMP_Settings.cfg to
# opt in to eddy-current rapid_scan (ignored on printers that do not support it).
# NOTE: Ensure you do not have conflicting BED_MESH_CALIBRATE renames in other
# macro configs (e.g., eddyprobe.cfg or custom homing macros).
# ==============================================================================
#[include kamp/KAMP_Settings.cfg]
#[include kamp/Adaptive_Mesh.cfg]
#[include kamp/Adaptive_Purge.cfg]
#[include kamp/Smart_Park.cfg]

# ==============================================================================
# OPTIONAL: Sensor-Aware Pre-Flight PRINT_START & PRINT_END Macros
# ==============================================================================
# Uncomment the line below to use Indus3D's sensor-aware pre-flight sequence.
# NOTE: If your slicer or existing macros already declare PRINT_START or
# PRINT_END, comment those out first to prevent duplicate macro collisions.
# ==============================================================================
#[include print_start_end.cfg]

# ==============================================================================
# Core Indus3D Control Wrappers
# ==============================================================================
[gcode_macro PAUSE_INDUS3D]
description: Pause the print (Indus3D wrapper)
gcode:
    PAUSE

[gcode_macro CANCEL_INDUS3D]
description: Cancel the print (Indus3D wrapper)
gcode:
    CANCEL_PRINT

[gcode_macro RESUME_INDUS3D]
description: Resume print after Indus3D inspection/clearance
gcode:
    RESUME
