# Indus3D Klipper Integration Configuration
# Include this in your printer.cfg: [include indus3d.cfg]

# Indus3D safety and control wrapper macros
# Allows physical screen / macro button clicks to synchronize cleanly with the digital twin
[gcode_macro PAUSE_INDUS3D]
description: Pause the print (Indus3D wrapper)
gcode:
    PAUSE

[gcode_macro CANCEL_INDUS3D]
description: Cancel the print (Indus3D wrapper)
gcode:
    CANCEL_PRINT

# Optional: Real-time ADXL345 Accelerometer Streaming over UDP
# Uncomment if using klipper_modules/indus_vibration.py
# [indus_vibration]
# udp_host: 127.0.0.1
# udp_port: 3200
