# =====================================================================
# Indus3D ESP8266 bed sensor hub: Klipper macros
#   ADXL345 on the bed (crash detection + Y input shaping), BME280 in the chamber.
#
# Include from printer.cfg:      [include esp8266_sensor_hub/bed_sensor_hub.cfg]
# Also needed (the installer takes care of both):
#   * bed_sensor_hub_shell.cfg   shell commands the macros call (requires the "G-Code Shell
#                                Command" Klipper extension, installable from KIAUH)
#   * [pause_resume]             and a PAUSE/RESUME macro (Mainsail/Fluidd client cfg)
#
# Flow on a crash: the hub daemon (esp_bed_monitor_daemon.py) sees the ESP's alert, pauses the print
# through Moonraker, then runs  BED_CRASH_HANDLER JERK=<mg>  which lifts and parks the toolhead
# and cools the hotend. BED_CRASH_RESUME reheats and continues. Nothing here moves the printer
# unless it is homed.
# =====================================================================

[respond]
default_type: echo

# ---------------------------------------------------------------------
# Settings and state (edit the values; do not rename the variables)
# ---------------------------------------------------------------------
[gcode_macro _BED_HUB_VARS]
description: Settings and state of the bed sensor hub macros
# -- crash handler ---------------------------------------------------
variable_park_x: 10.0                 # parking position, clamped to the axis range
variable_park_y: 220.0
variable_zhop: 10.0                   # lift on a crash, limited by the Z axis maximum
variable_retract_mm: 2.0              # filament pulled back to stop oozing onto the part
variable_retract_speed: 30.0          # mm/s
variable_keep_bed_hot: True           # the hotend is always switched off, the bed only if False
variable_crash_threshold_mg: 2000     # informational copy; SET_BED_CRASH_THRESHOLD changes the hub
# -- buzzer (optional: an [output_pin beeper]; nothing happens without one) ----
variable_beeper: "beeper"
variable_beep_value: 1.0              # use 0.5 with a pwm pin and a passive buzzer
# -- input shaper sweep ---------------------------------------------------
variable_shaper_rate: 1600            # accelerometer sample rate
variable_sweep_start_hz: 5
variable_sweep_end_hz: 120
variable_sweep_step_hz: 5
variable_sweep_dwell_s: 0.25          # time spent at each frequency
variable_sweep_max_amp: 3.0           # mm, at low frequencies
variable_sweep_max_accel: 7000.0      # mm/s^2 the sweep may demand at the high frequencies
variable_shaper_autoapply: 0          # 1 = BED_SHAPER_CALIBRATE_Y writes [input_shaper] to printer.cfg
variable_printer_cfg: ""              # absolute path, filled in by the installer (no spaces)
variable_outdir: "/tmp/bed_shaper"    # report, plot and snippet are written here (filled in by the installer)
# -- state, written by the macros --------------------------------------------
variable_crash_active: False
variable_saved_extruder_target: 0.0
variable_saved_bed_target: 0.0
variable_retracted: False
variable_last_jerk: 0
gcode:

# ---------------------------------------------------------------------
# Beep (does nothing unless [output_pin <beeper>] exists, so it can never break a handler)
# ---------------------------------------------------------------------
[gcode_macro _BED_HUB_BEEP]
description: One beep of P milliseconds
gcode:
    {% set vars = printer["gcode_macro _BED_HUB_VARS"] %}
    {% set pin = "output_pin " ~ vars.beeper %}
    {% if pin in printer %}
        SET_PIN PIN={vars.beeper} VALUE={vars.beep_value}
        G4 P{params.P|default(150)|int}
        SET_PIN PIN={vars.beeper} VALUE=0
    {% endif %}

# ---------------------------------------------------------------------
# Crash handler: called by the hub daemon right after it paused the print
# ---------------------------------------------------------------------
[gcode_macro BED_CRASH_HANDLER]
description: Safe-park after a bed collision (JERK=<mg> from the hub)
gcode:
    {% set vars = printer["gcode_macro _BED_HUB_VARS"] %}
    {% set th = printer.toolhead %}
    {% set ext = th.extruder %}
    {% set jerk = params.JERK|default(0)|float|round|int %}
    {% set bed_t = printer.heater_bed.target|float if "heater_bed" in printer else 0.0 %}

    {% if vars.crash_active and printer.pause_resume.is_paused %}
        # a second alert for a crash we are already holding: do not overwrite the saved temperatures
        RESPOND TYPE=error MSG="Bed crash alert repeated (jerk {jerk} mg); the print is already held. Fix the cause, then run BED_CRASH_RESUME."
    {% else %}
        SET_GCODE_VARIABLE MACRO=_BED_HUB_VARS VARIABLE=crash_active VALUE=True
        SET_GCODE_VARIABLE MACRO=_BED_HUB_VARS VARIABLE=last_jerk VALUE={jerk}
        SET_GCODE_VARIABLE MACRO=_BED_HUB_VARS VARIABLE=saved_extruder_target VALUE={printer[ext].target|float}
        SET_GCODE_VARIABLE MACRO=_BED_HUB_VARS VARIABLE=saved_bed_target VALUE={bed_t}
        SET_GCODE_VARIABLE MACRO=_BED_HUB_VARS VARIABLE=retracted VALUE=False

        M117 BED CRASH {jerk} mg
        RESPOND TYPE=error MSG="BED COLLISION: the sensor hub measured {jerk} mg of jerk. Parking the toolhead and cooling the hotend."

        SAVE_GCODE_STATE NAME=BED_CRASH_STATE
        {% if not printer.pause_resume.is_paused %}
            PAUSE
        {% endif %}

        {% if "xyz" in th.homed_axes %}
            # 1. pull the filament back so it does not ooze onto the part
            {% if printer[ext].can_extrude and vars.retract_mm|float > 0 %}
                M83
                G1 E-{vars.retract_mm|float} F{(vars.retract_speed|float * 60)|round|int}
                SET_GCODE_VARIABLE MACRO=_BED_HUB_VARS VARIABLE=retracted VALUE=True
            {% endif %}

            # 2. lift, never beyond the Z axis maximum
            {% set z_lift = [vars.zhop|float, th.axis_maximum.z|float - th.position.z|float]|min %}
            {% if z_lift > 0 %}
                G91
                G1 Z{z_lift|round(3)} F600
            {% endif %}

            # 3. park, inside the axis ranges
            {% set px = [[vars.park_x|float, th.axis_minimum.x|float]|max, th.axis_maximum.x|float]|min %}
            {% set py = [[vars.park_y|float, th.axis_minimum.y|float]|max, th.axis_maximum.y|float]|min %}
            G90
            G1 X{px} Y{py} F6000
        {% else %}
            RESPOND TYPE=error MSG="Axes are not homed: the toolhead was not moved."
        {% endif %}

        # 4. hotend off (the target was saved above); the bed stays hot unless configured otherwise
        SET_HEATER_TEMPERATURE HEATER={ext} TARGET=0
        {% if not vars.keep_bed_hot %}
            SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET=0
        {% endif %}

        # 5. three beeps
        _BED_HUB_BEEP P=200
        G4 P100
        _BED_HUB_BEEP P=200
        G4 P100
        _BED_HUB_BEEP P=400

        RESPOND TYPE=error MSG="Print paused. Inspect the bed, then run BED_CRASH_RESUME (or CANCEL_PRINT)."
    {% endif %}

# ---------------------------------------------------------------------
# Safe resume
# ---------------------------------------------------------------------
[gcode_macro BED_CRASH_RESUME]
description: Reheat, re-prime, clear the hub's crash latch and resume the print
gcode:
    {% set vars = printer["gcode_macro _BED_HUB_VARS"] %}
    {% set ext = printer.toolhead.extruder %}
    {% set et = vars.saved_extruder_target|float %}
    {% set bt = vars.saved_bed_target|float %}

    {% if not printer.pause_resume.is_paused %}
        {action_raise_error("The print is not paused, there is nothing to resume.")}
    {% endif %}
    {% if not vars.crash_active %}
        {action_raise_error("No bed crash was recorded by BED_CRASH_HANDLER. Use RESUME for an ordinary pause.")}
    {% endif %}

    RESPOND MSG="Reheating (hotend {et|round|int} C, bed {bt|round|int} C) and clearing the hub's crash latch..."
    M117 Resuming after bed crash
    {% if bt > 0 %}
        M140 S{bt}
    {% endif %}
    {% if et > 0 %}
        M109 S{et}
    {% endif %}
    {% if bt > 0 %}
        M190 S{bt}
    {% endif %}

    {% if vars.retracted and et > 0 %}
        M83
        G1 E{vars.retract_mm|float} F{(vars.retract_speed|float * 60)|round|int}
    {% endif %}

    {% if "gcode_shell_command reset_hub_crash" in printer.configfile.config %}
        RUN_SHELL_COMMAND CMD=reset_hub_crash
    {% else %}
        RESPOND TYPE=error MSG="reset_hub_crash is not configured (bed_sensor_hub_shell.cfg): the hub's latch was not cleared."
    {% endif %}

    SET_GCODE_VARIABLE MACRO=_BED_HUB_VARS VARIABLE=crash_active VALUE=False
    RESTORE_GCODE_STATE NAME=BED_CRASH_STATE MOVE=1 MOVE_SPEED=80
    RESUME

# ---------------------------------------------------------------------
# Hub housekeeping (these show up as buttons in Mainsail/Fluidd)
# ---------------------------------------------------------------------
[gcode_macro BED_HUB_RESET_CRASH]
description: Reset Bed Crash Latch (on the hub)
gcode:
    {% if "gcode_shell_command reset_hub_crash" in printer.configfile.config %}
        RUN_SHELL_COMMAND CMD=reset_hub_crash
    {% else %}
        {action_raise_error("reset_hub_crash is not configured: include bed_sensor_hub_shell.cfg")}
    {% endif %}
    # a stale crash flag after CANCEL_PRINT must not block the next handler
    {% if not printer.pause_resume.is_paused %}
        SET_GCODE_VARIABLE MACRO=_BED_HUB_VARS VARIABLE=crash_active VALUE=False
    {% endif %}

[gcode_macro BED_HUB_STATUS]
description: Sensor Hub Status (chamber, bed accelerometer, crash latch)
gcode:
    {% if "gcode_shell_command hub_status" in printer.configfile.config %}
        RUN_SHELL_COMMAND CMD=hub_status
    {% else %}
        {action_raise_error("hub_status is not configured: include bed_sensor_hub_shell.cfg")}
    {% endif %}

[gcode_macro SET_BED_CRASH_THRESHOLD]
description: Set the hub's crash threshold, e.g. SET_BED_CRASH_THRESHOLD VALUE=2500 (500-8000 mg)
gcode:
    {% set vars = printer["gcode_macro _BED_HUB_VARS"] %}
    {% set v = params.VALUE|default(0)|int %}
    {% if v < 500 or v > 8000 %}
        {action_raise_error("SET_BED_CRASH_THRESHOLD VALUE=<mg> needs a value between 500 and 8000 (now %d mg)." % vars.crash_threshold_mg|int)}
    {% endif %}
    {% if "gcode_shell_command set_hub_threshold" in printer.configfile.config %}
        RUN_SHELL_COMMAND CMD=set_hub_threshold PARAMS="{v}"
        SET_GCODE_VARIABLE MACRO=_BED_HUB_VARS VARIABLE=crash_threshold_mg VALUE={v}
        RESPOND MSG="Crash threshold requested: {v} mg (the hub confirms in the console)."
    {% else %}
        {action_raise_error("set_hub_threshold is not configured: include bed_sensor_hub_shell.cfg")}
    {% endif %}

# ---------------------------------------------------------------------
# Y input shaper calibration with the bed accelerometer
#
# Disabled: the shell extension waits for capture completion before executing the next
# movement. Keep a fail-closed entrypoint so existing dashboards cannot run an invalid
# sweep or persist stationary-noise recommendations.
# ---------------------------------------------------------------------
[gcode_macro BED_SHAPER_CALIBRATE_Y]
description: Disabled pending synchronized bed capture and supervised validation
gcode:
    {action_raise_error("Bed shaper sweep disabled: RUN_SHELL_COMMAND blocks until capture completes, so the sweep cannot be measured. Use offline analysis or Klipper SHAPER_CALIBRATE with a supported accelerometer. No settings were changed.")}
