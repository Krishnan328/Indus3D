# =====================================================================
# Indus3D ESP8266 Multi-Sensor Hub Klipper Configuration & Macros
# Bed Collision Monitor + Input Shaping + Chamber Telemetry
# =====================================================================

[respond]
default_type: echo

# ---------------------------------------------------------------------
# Global Hub Variables
# ---------------------------------------------------------------------
[gcode_macro _BED_HUB_VARS]
variable_esp_ip: "192.168.1.150"       # Set this to your ESP8266 IP or esp8266-bedhub.local
variable_esp_port: 80
variable_park_x: 10.0                  # Safe X park position
variable_park_y: 220.0                 # Safe Y park position
variable_zhop: 10.0                    # Safe Z lift on collision
variable_retract_mm: 2.0               # Anti-ooze filament retraction
variable_bed_temp_preserve: True       # Preserve bed temperature on pause
gcode:

# ---------------------------------------------------------------------
# Bed Crash & Collision Handler Macro
# Invoked immediately when ESP8266 detects jerk > threshold_mg (e.g. 2000 mg)
# ---------------------------------------------------------------------
[gcode_macro BED_CRASH_HANDLER]
description: Emergency safe-parking macro triggered on bed collision
gcode:
    {% set jerk = params.JERK|default(2000)|int %}
    {% set vars = printer["gcode_macro _BED_HUB_VARS"] %}

    {action_respond_info("!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!")}
    {action_respond_info("CRITICAL ALERT: BED COLLISION DETECTED BY SENSOR HUB!")}
    {action_respond_info("Instantaneous Jerk: %d mg (Threshold exceeded)" % (jerk))}
    {action_respond_info("Pausing print and parking toolhead at safe coordinates...")}
    {action_respond_info("!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!")}

    M117 BED CRASH DETECTED!

    # 1. Save gcode state
    SAVE_GCODE_STATE NAME=BED_CRASH_STATE

    # 2. Issue Klipper pause
    PAUSE

    # 3. Retract filament to prevent oozing onto print
    {% if printer.extruder.can_extrude %}
        G91
        G1 E-{vars.retract_mm} F1800
    {% endif %}

    # 4. Perform Z-hop to lift nozzle away from workpiece
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set act_z = printer.toolhead.position.z|float %}
    {% set z_lift = vars.zhop|float %}
    {% if act_z + z_lift > max_z %}
        {% set z_lift = max_z - act_z %}
    {% endif %}

    {% if z_lift > 0 %}
        G91
        G1 Z{z_lift} F600
    {% endif %}

    # 5. Move toolhead to safe parking position
    G90
    G1 X{vars.park_x} Y{vars.park_y} F6000

    # 6. Safety cooling: Turn off hotend heater to prevent cooking filament
    # Bed heater remains on if bed_temp_preserve is true
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET=0
    {% if not vars.bed_temp_preserve %}
        SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET=0
    {% endif %}

    # 7. Audible buzzer alert (three high-pitched beeps)
    M300 P200 S2000
    G4 P100
    M300 P200 S2000
    G4 P100
    M300 P400 S2500

# ---------------------------------------------------------------------
# Safe Resume from Bed Collision Pause
# ---------------------------------------------------------------------
[gcode_macro BED_CRASH_RESUME]
description: Safely restore temperatures, reset ESP8266 crash latch, and resume print
gcode:
    {% set vars = printer["gcode_macro _BED_HUB_VARS"] %}

    {action_respond_info("Restoring temperatures and clearing ESP8266 collision latch...")}

    # Reset ESP8266 crash state via Moonraker shell command or curl
    BED_HUB_RESET_CRASH

    # Re-heat extruder to target stored in print state
    {% if printer.pause_resume.is_paused %}
        # Check target before pause or default
        {% set target_temp = printer[printer.toolhead.extruder].target|float %}
        {% if target_temp == 0 %}
            # Default to 210C if target was cleared
            {% set target_temp = 210.0 %}
        {% endif %}
        M109 S{target_temp}

        # Prime nozzle
        G91
        G1 E{vars.retract_mm} F1800

        # Restore state and resume
        RESTORE_GCODE_STATE NAME=BED_CRASH_STATE MOVE=1 MOVE_SPEED=80
        RESUME
        M117 Print Resumed
    {% else %}
        {action_respond_info("Printer is not paused. Cannot resume.")}
    {% endif %}

# ---------------------------------------------------------------------
# Query ESP8266 Sensor Hub Status & Telemetry
# ---------------------------------------------------------------------
[gcode_macro BED_HUB_STATUS]
description: Displays ESP8266 Multi-Sensor Hub operational metrics
gcode:
    {% set vars = printer["gcode_macro _BED_HUB_VARS"] %}
    {action_respond_info("=== Indus3D ESP8266 Multi-Sensor Hub ===")}
    {action_respond_info("Host Target: http://%s:%d" % (vars.esp_ip, vars.esp_port))}
    {action_respond_info("Telemetry: http://%s:%d/telemetry" % (vars.esp_ip, vars.esp_port))}
    {action_respond_info("Chamber: http://%s:%d/chamber" % (vars.esp_ip, vars.esp_port))}

# ---------------------------------------------------------------------
# Reset ESP8266 Crash Latch via HTTP
# ---------------------------------------------------------------------
[gcode_macro BED_HUB_RESET_CRASH]
description: Clear latched crash status on ESP8266 hub
gcode:
    {% set vars = printer["gcode_macro _BED_HUB_VARS"] %}
    # Calls Moonraker remote method or outputs instruction
    {action_respond_info("Sent crash reset signal to ESP8266 at http://%s:%d/reset_crash" % (vars.esp_ip, vars.esp_port))}

# ---------------------------------------------------------------------
# Automated Y-Carriage Input Shaping Calibration Routine
# Coordinates frequency vibration excitation with ESP8266 high-speed stream
# ---------------------------------------------------------------------
[gcode_macro BED_SHAPER_CALIBRATE]
description: Run automated Y-axis resonance frequency sweep and capture with ESP8266
gcode:
    {% set duration = params.DURATION|default(7)|int %}
    {% set rate = params.RATE|default(1600)|int %}
    {% set vars = printer["gcode_macro _BED_HUB_VARS"] %}

    {action_respond_info("=================================================")}
    {action_respond_info("STARTING BED INPUT SHAPING CALIBRATION (Y AXIS)")}
    {action_respond_info("Excitation Duration: %d s | Sampling Rate: %d Hz" % (duration, rate))}
    {action_respond_info("Connect Python analyzer: esp_shaper_analyzer.py --ip %s" % (vars.esp_ip))}
    {action_respond_info("=================================================")}

    # Ensure homing
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}

    # Position bed in center of travel
    {% set center_x = printer.toolhead.axis_maximum.x / 2.0 %}
    {% set center_y = printer.toolhead.axis_maximum.y / 2.0 %}
    G90
    G1 X{center_x} Y{center_y} Z20 F6000
    M400

    M117 Shaper: Starting Y sweep...
    {action_respond_info("Executing calibrated frequency excitation on Y-axis...")}

    # Sinusoidal frequency sweep simulation (5 Hz to 120 Hz)
    # Oscillate Y bed back and forth with micro-steps at accelerating rates
    {% for step in range(5, 100, 3) %}
        {% set feed = step * 120 %}
        G91
        G1 Y+1.5 F{feed}
        G1 Y-1.5 F{feed}
        G1 Y-1.5 F{feed}
        G1 Y+1.5 F{feed}
    {% endfor %}
    G90
    M400

    M117 Shaper: Sweep completed!
    {action_respond_info("Y-axis resonance excitation finished.")}
    {action_respond_info("Run python3 scripts/esp_shaper_analyzer.py to calculate shaper filters.")}

# ---------------------------------------------------------------------
# Optional Buzzer (M300) Macro Emulation
# ---------------------------------------------------------------------
[gcode_macro M300]
description: Tone buzzer emulation
gcode:
    {% set S = params.S|default(1000)|int %}
    {% set P = params.P|default(100)|int %}
    SET_PIN PIN=beeper VALUE=1
    G4 P{P}
    SET_PIN PIN=beeper VALUE=0
