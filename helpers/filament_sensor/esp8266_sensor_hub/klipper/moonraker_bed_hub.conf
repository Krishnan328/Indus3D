# =====================================================================
# Moonraker side of the ESP8266 bed sensor hub  (include from moonraker.conf:
#   [include esp8266_sensor_hub/moonraker_bed_hub.conf]   — the installer does this)
#
# What this gives you: chamber temperature / humidity / pressure, the bed jerk and the crash latch as a
# "sensor" card in Fluidd (and in Mainsail versions that list Moonraker sensors). The values come from
# the hub daemon, which publishes them to an MQTT broker (run it with --mqtt localhost); Moonraker's
# [sensor] component is MQTT-only, so a broker (e.g. mosquitto on the same host) is required.
#
# Not here, on purpose:
#   * [authorization]: it may appear only once in moonraker.conf, and a second copy would stop Moonraker
#     from starting. The hub daemon runs on the printer's own host and calls Moonraker on 127.0.0.1,
#     so it only needs 127.0.0.0/8 in your existing trusted_clients (the Mainsail and Fluidd stock
#     configs have it). Add the Mainsail/Fluidd origins to your existing cors_domains if you open the
#     UI from another machine.
#   * gcode_shell_command: that is a *Klipper* extra (see bed_sensor_hub_shell.cfg), not Moonraker.
# =====================================================================

[mqtt]
address: localhost
port: 1883
# username:
# password:
enable_moonraker_api: False

[sensor bed_hub]
type: mqtt
name: Bed sensor hub
state_topic: indus3d/bed_hub/state
parameter_chamber_temp:
  units=°C
parameter_chamber_humidity:
  units=%
parameter_chamber_pressure:
  units=hPa
parameter_bed_jerk:
  units=mg
parameter_crash_latched:
  units=0/1
# The daemon leaves a chamber value out when the BME280 reports nothing, so a dead sensor shows no
# value instead of 0.
state_response_template:
  {% set d = payload|fromjson %}
  {% if "chamber_temp_c" in d %}{set_result("chamber_temp", d["chamber_temp_c"]|float)}{% endif %}
  {% if "chamber_humidity_pct" in d %}{set_result("chamber_humidity", d["chamber_humidity_pct"]|float)}{% endif %}
  {% if "chamber_pressure_hpa" in d %}{set_result("chamber_pressure", d["chamber_pressure_hpa"]|float)}{% endif %}
  {set_result("bed_jerk", d["bed_jerk_mg"]|float)}
  {set_result("crash_latched", d["crash_latched"]|int)}
