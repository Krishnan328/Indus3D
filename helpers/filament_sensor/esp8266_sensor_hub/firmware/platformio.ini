[platformio]
default_envs = d1_mini

[env:d1_mini]
platform = espressif8266
board = d1_mini
framework = arduino
upload_speed = 460800
monitor_speed = 115200
build_flags = 
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_EXCEPTIONS
    -D NO_EXTRA_4K_MUST_REPLACE_WITH_APPROPRIATE_FLAG
    -O2
lib_deps =
    bblanchon/ArduinoJson @ ^6.21.4
