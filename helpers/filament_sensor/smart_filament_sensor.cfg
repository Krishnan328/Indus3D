# =====================================================================
# Indus3D Smart Filament Sensor - Klipper Configuration & Macros
# =====================================================================
#
# Installation:
# 1. Place this file in your Klipper config directory (e.g., ~/printer_data/config/)
# 2. Add the following line to your printer.cfg:
#       [include smart_filament_sensor.cfg]
#
# =====================================================================
# How to Measure Your Bowden Tube Distance:
# =====================================================================
# The sensor sits upstream from the extruder. To take full advantage of
# zero-waste runout and diameter compensation, measure your tube length:
#
# 1. Feed a strand of filament into the sensor until its tip sits exactly
#    flush with the sensor exit collet.
# 2. Mark the filament with a permanent marker where it enters the extruder.
# 3. Pull the strand out and measure the distance between the tip and mark.
# 4. Set 'bowden_length' below or run in Klipper terminal:
#       SET_BOWDEN_LENGTH LENGTH=<measured_mm>
# =====================================================================

[respond]
default_type: echo

[gcode_macro _SMART_SENSOR_VARS]
description: Configuration variables for Indus3D Smart Filament Sensor
variable_bowden_length: 650.0       # mm from sensor exit to extruder drive gears
variable_runout_margin: 40.0        # mm safety margin in front of extruder gears
variable_park_x: 10.0               # Front X park coordinate during pause
variable_park_y: 10.0               # Front Y park coordinate during pause
variable_park_z_hop: 5.0            # Z-hop lift height during park
variable_retract_length: 2.0        # mm to retract when pausing
variable_purge_length: 50.0         # mm to purge when loading new filament
variable_standby_temp_drop: 0       # Set > 0 to drop hotend temp during prolonged pause (e.g. 30C)
gcode:
    # Internal variables container

# =====================================================================
# 1. Zero-Waste Smart Runout Pause
# =====================================================================
[gcode_macro SMART_RUNOUT_PAUSE]
description: Triggered when the remaining Bowden filament buffer is exhausted
gcode:
    {% set sv = printer["gcode_macro _SMART_SENSOR_VARS"] %}
    RESPOND TYPE=error MSG="⚠️ FILAMENT RUNOUT! Buffer exhausted. Toolhead parked for spool swap."
    
    # Save current print state
    SAVE_GCODE_STATE NAME=SMART_RUNOUT_STATE
    
    # Pause Klipper print execution
    PAUSE
    
    # Retract slightly to prevent oozing
    G91
    G1 E-{sv.retract_length} F2100
    
    # Z-hop and park at front maintenance position
    {% if printer.toolhead.position.z < (printer.toolhead.axis_maximum.z - sv.park_z_hop) %}
        G1 Z{sv.park_z_hop} F1200
    {% endif %}
    G90
    G1 X{sv.park_x} Y{sv.park_y} F6000
    
    # Audible alert (if beeper configured)
    M300 P300 S1000
    M300 P300 S1500

# =====================================================================
# 2. Extruder Clog / Slip Detected Pause
# =====================================================================
[gcode_macro CLOG_DETECTED_PAUSE]
description: Triggered by Indus3D daemon when extruder slips or hotend clogs
gcode:
    {% set sv = printer["gcode_macro _SMART_SENSOR_VARS"] %}
    RESPOND TYPE=error MSG="🚨 CLOG / SLIP DETECTED! Extruder motor was pushing but filament motion stalled."
    
    SAVE_GCODE_STATE NAME=CLOG_PAUSE_STATE
    PAUSE
    
    # Retract to relieve nozzle melt zone backpressure
    G91
    G1 E-{sv.retract_length * 2} F1800
    
    {% if printer.toolhead.position.z < (printer.toolhead.axis_maximum.z - sv.park_z_hop) %}
        G1 Z{sv.park_z_hop} F1200
    {% endif %}
    G90
    G1 X{sv.park_x} Y{sv.park_y} F6000
    
    # Multiple alarm beeps
    M300 P200 S2000
    M300 P100 S0
    M300 P200 S2000
    M300 P100 S0
    M300 P400 S2000

# =====================================================================
# 3. Spool Tangle / Snag Detected Pause
# =====================================================================
[gcode_macro SPOOL_TANGLE_PAUSE]
description: Triggered when filament tension locks up due to spool snag or knot
gcode:
    {% set sv = printer["gcode_macro _SMART_SENSOR_VARS"] %}
    RESPOND TYPE=error MSG="🛑 SPOOL TANGLE / SNAG DETECTED! Motion halted abruptly under tension."
    
    SAVE_GCODE_STATE NAME=TANGLE_PAUSE_STATE
    PAUSE
    
    # Do not retract aggressively into a snagged spool; lift and park
    G91
    {% if printer.toolhead.position.z < (printer.toolhead.axis_maximum.z - sv.park_z_hop) %}
        G1 Z{sv.park_z_hop} F1200
    {% endif %}
    G90
    G1 X{sv.park_x} Y{sv.park_y} F6000

# =====================================================================
# 4. Filament Swap & Reload Helpers
# =====================================================================
[gcode_macro RESET_BOWDEN_BUFFER]
description: Clears pre-measured Bowden tube diameter profile in Indus3D daemon
gcode:
    RESPOND TYPE=echo MSG="Indus3D: Resetting Bowden tube diameter buffer to default nominal..."

[gcode_macro LOAD_NEW_FILAMENT]
description: Purges and primes the hotend with the new spool, then prepares resume
gcode:
    {% set sv = printer["gcode_macro _SMART_SENSOR_VARS"] %}
    {% set purge_len = params.PURGE|default(sv.purge_length)|float %}
    
    RESET_BOWDEN_BUFFER
    RESPOND TYPE=echo MSG="Feeding and purging new filament..."
    G91
    G1 E{purge_len} F300     # Extrude slowly to purge old color
    G1 E-{sv.retract_length} F2100 # Tiny anti-ooze retract
    G90
    
    RESPOND TYPE=echo MSG="Purge complete! Clean nozzle tip and press RESUME."

[gcode_macro M600]
description: Filament change command (compatible with slicer layer pauses)
gcode:
    SMART_RUNOUT_PAUSE

# =====================================================================
# 5. Runtime Calibration Overrides
# =====================================================================
[gcode_macro SET_BOWDEN_LENGTH]
description: Update Bowden tube buffer distance on the fly
gcode:
    {% if 'LENGTH' in params %}
        {% set new_len = params.LENGTH|float %}
        SET_GCODE_VARIABLE MACRO=_SMART_SENSOR_VARS VARIABLE=bowden_length VALUE={new_len}
        RESPOND TYPE=echo MSG="Indus3D: Updated Bowden delay distance to {new_len} mm"
    {% else %}
        RESPOND TYPE=error MSG="Usage: SET_BOWDEN_LENGTH LENGTH=<mm>"
    {% endif %}

[gcode_macro SET_FILAMENT_SPOOL]
description: Inform Indus3D daemon of new spool material and weight
gcode:
    {% set mat = params.MATERIAL|default("PLA")|string %}
    {% set wt = params.WEIGHT|default(1000)|float %}
    RESPOND TYPE=echo MSG="Indus3D Spool Profile set: {mat} ({wt}g)"

# Optional Beeper Macro (if printer does not have M300 defined)
[gcode_macro M300]
gcode:
    # Silent fallback if no hardware beeper pin exists
    {% set S = params.S|default(1000)|int %}
    {% set P = params.P|default(100)|int %}
    {% if 'output_pin beeper' in printer %}
        SET_PIN PIN=beeper VALUE=1
        G4 P{P}
        SET_PIN PIN=beeper VALUE=0
    {% endif %}
