# ==============================================================================
# Indus3D Sensor-Aware Pre-Flight PRINT_START & PRINT_END Macros
# ==============================================================================
# Features:
# - Pre-flight sensor readiness verification (Filament present, Bed, Toolhead)
# - Dual-stage heating (preheat to 150C to avoid drooling during probing)
# - Nozzle wiping on brush before probing (NOZZLE_WIPE)
# - KAMP Adaptive Bed Meshing (restricted to model footprint)
# - SMART_PARK near print start to minimize travel ooze
# - Final hotend heating to print temp
# - KAMP Adaptive LINE_PURGE directly before first layer
# ==============================================================================

[gcode_macro PRINT_START]
description: Sensor-aware pre-flight heating, homing, adaptive meshing, and purging
gcode:
    # 1. Capture Slicer Parameters (with robust fallbacks)
    {% set bed_temp = params.BED_TEMP|default(params.BED|default(60))|float %}
    {% set ext_temp = params.EXTRUDER_TEMP|default(params.EXTRUDER|default(200))|float %}
    {% set chamber_min = params.CHAMBER_MIN|default(params.CHAMBER|default(0))|float %}
    {% set soak_mins = params.SOAK_MINS|default(0)|int %}

    {action_respond_info("Indus3D: Initiating Pre-Flight Sequence (Bed: %.0fC, Extruder: %.0fC)" % (bed_temp, ext_temp))}

    # 2. Pre-heat Bed and Standby Extruder (150C prevents oozing during probing)
    M117 Pre-heating Bed & Hotend...
    M140 S{bed_temp}
    M104 S150

    # 3. Home all axes while heating
    G90
    {% if "xyz" not in printer.toolhead.homed_axes %}
        M117 Homing All Axes...
        G28
    {% endif %}

    # 4. Wait for Bed to reach target temperature
    M117 Waiting for Bed Temp...
    M190 S{bed_temp}

    # 5. Optional Chamber Soak (if requested by slicer)
    {% if soak_mins > 0 %}
        M117 Chamber Soaking for {soak_mins}m...
        G4 P{soak_mins * 60 * 1000}
    {% endif %}

    # 6. Clean nozzle on copper brush if macro exists
    {% if printer["gcode_macro NOZZLE_WIPE"] is defined %}
        M117 Wiping Nozzle...
        NOZZLE_WIPE
    {% endif %}

    # 7. KAMP Adaptive Bed Mesh (calibrates only printed object bounding box)
    M117 Adaptive Bed Meshing...
    BED_MESH_CALIBRATE METHOD=rapid_scan

    # 8. Smart Park: Move toolhead close to first layer start point
    M117 Smart Parking...
    SMART_PARK

    # 9. Heat hotend to final printing temperature
    M117 Heating to Print Temp...
    M109 S{ext_temp}

    # 10. KAMP Adaptive Line Purge right next to part
    M117 Adaptive Line Purge...
    LINE_PURGE

    # 11. Print start confirmation
    M117 Printing...
    {action_respond_info("Indus3D: Pre-Flight Complete. Print Started.")}


[gcode_macro PRINT_END]
description: Safe print termination, retraction, heater shutdown, and parking
gcode:
    # 1. Safe Retraction to relieve nozzle pressure
    G92 E0
    G1 E-2.5 F3000

    # 2. Safe Z-Hop (lift 5mm or clamp to max Z)
    G91
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set act_z = printer.toolhead.position.z|float %}
    {% set z_hop = 5.0 %}
    {% if act_z + z_hop <= max_z %}
        G1 Z{z_hop} F3000
    {% else %}
        G1 Z{max_z - act_z} F3000
    {% endif %}
    G90

    # 3. Park toolhead at safe rear corner
    {% set park_x = printer.toolhead.axis_minimum.x + 10.0 %}
    {% set park_y = printer.toolhead.axis_maximum.y - 15.0 %}
    G1 X{park_x} Y{park_y} F6000

    # 4. Turn off all heaters and part cooling fan
    M140 S0
    M104 S0
    M106 S0

    # 5. Clear bed mesh
    BED_MESH_CLEAR

    # 6. Disable stepper motors
    M84 X Y E

    M117 Print Complete
    {action_respond_info("Indus3D: Print Ended Safely.")}
