# Optional production nginx front-end for Indus3D. It serves the built Vite
# app and proxies both HTTP and the telemetry WebSocket through one port.
# Install on the Pi as /etc/nginx/sites-available/indus3d, enable it, then
# run `sudo nginx -t && sudo systemctl restart nginx`.
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Adjust this to the location used by deploy_to_pi.sh on the Pi.
    root /home/pi/indus3d/frontend/dist;
    index index.html;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Must match FLASK_PORT in backend/.env (5001 by default).
    location /api/ {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }

    location /ws/ {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
}
