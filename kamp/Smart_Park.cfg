# ==============================================================================
# Indus3D Smart Park (KAMP)
# ==============================================================================
# Parks the toolhead directly above the first layer start location during
# hotend heating to avoid ooze and long travel moves before the first layer.
# ==============================================================================

[gcode_macro SMART_PARK]
description: Parks toolhead 5mm above the print area near the first extrusion point
gcode:
    {% set kamp = printer["gcode_macro _KAMP_Settings"] %}
    {% set all_points = [] %}
    
    {% if printer.exclude_object is defined and printer.exclude_object.objects %}
        {% for obj in printer.exclude_object.objects %}
            {% for pt in obj.polygon %}
                {% set _ = all_points.append(pt) %}
            {% endfor %}
        {% endfor %}
    {% endif %}

    {% if all_points|length > 0 %}
        {% set x_vals = all_points | map(attribute=0) | list %}
        {% set y_vals = all_points | map(attribute=1) | list %}
        {% set park_x = [((x_vals | min) - kamp.purge_margin), 10.0] | max %}
        {% set park_y = [((y_vals | min) - kamp.purge_margin), 10.0] | max %}
    {% else %}
        {% set park_x = 10.0 %}
        {% set park_y = 10.0 %}
    {% endif %}

    {% set park_z = kamp.smart_park_z_hop %}

    {% if kamp.verbose_enable %}
        {action_respond_info("Indus3D KAMP: Smart parking at X=%.1f, Y=%.1f, Z=%.1f" % (park_x, park_y, park_z))}
    {% endif %}

    G90
    G1 Z{park_z + 5.0} F3000
    G1 X{park_x} Y{park_y} F6000
    G1 Z{park_z} F1500
