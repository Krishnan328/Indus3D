# ==============================================================================
# Indus3D Smart Park (KAMP)
# ==============================================================================
# Parks the toolhead directly above the first layer start location during
# hotend heating to avoid ooze and long travel moves before the first layer.
# The target is always kept inside the printer's own axis limits.
# ==============================================================================

[gcode_macro SMART_PARK]
description: Parks toolhead above the print area near the first extrusion point
gcode:
    {% set kamp = printer["gcode_macro _KAMP_Settings"] %}
    {% set th = printer.toolhead %}
    {% set edge = kamp.edge_margin|default(10.0)|float %}
    {% set lo_x = th.axis_minimum.x|float + edge %}
    {% set hi_x = th.axis_maximum.x|float - edge %}
    {% set lo_y = th.axis_minimum.y|float + edge %}
    {% set hi_y = th.axis_maximum.y|float - edge %}
    {% set all_points = [] %}

    {% if printer.exclude_object is defined and printer.exclude_object.objects %}
        {% for obj in printer.exclude_object.objects %}
            {% for pt in obj.polygon %}
                {% set _ = all_points.append(pt) %}
            {% endfor %}
        {% endfor %}
    {% endif %}

    {% if all_points|length > 0 %}
        {% set x_vals = all_points | map(attribute=0) | list %}
        {% set y_vals = all_points | map(attribute=1) | list %}
        {% set park_x = [[(x_vals | min) - kamp.purge_margin, lo_x] | max, hi_x] | min %}
        {% set park_y = [[(y_vals | min) - kamp.purge_margin, lo_y] | max, hi_y] | min %}
    {% else %}
        {% set park_x = lo_x %}
        {% set park_y = lo_y %}
    {% endif %}

    {% set max_z = th.axis_maximum.z|float %}
    {% set park_z = [kamp.smart_park_z_hop|float, max_z] | min %}
    {% set lift_z = [park_z + 5.0, max_z] | min %}

    {% if "xyz" not in th.homed_axes %}
        {action_respond_info("Indus3D KAMP: Smart park skipped, axes are not homed")}
    {% else %}
        {% if kamp.verbose_enable %}
            {action_respond_info("Indus3D KAMP: Smart parking at X=%.1f, Y=%.1f, Z=%.1f" % (park_x, park_y, park_z))}
        {% endif %}
        SAVE_GCODE_STATE NAME=_SMART_PARK
        G90
        G1 Z{lift_z} F3000
        G1 X{park_x} Y{park_y} F6000
        G1 Z{park_z} F1500
        RESTORE_GCODE_STATE NAME=_SMART_PARK
    {% endif %}
