# ==============================================================================
# Indus3D KAMP (Klipper Adaptive Meshing & Purging) Configuration
# ==============================================================================
# This configuration adapts bed probing and purge moves to the exact bounding
# box of the current print file, saving time and mechanical wear.
#
# Nothing here assumes a particular printer: mesh bounds, axis limits, probe
# offsets and the filament diameter are read from your own Klipper config.
# ==============================================================================

[gcode_macro _KAMP_Settings]
description: Configuration parameters for Indus3D KAMP macros
variable_verbose_enable: True

# Mesh margins (distance to expand mesh outside the printed objects)
variable_mesh_margin: 5.0

# Minimum probe count per axis (small prints)
variable_min_probe_count: 5

# Maximum probe count per axis (large prints)
variable_max_probe_count: 15

# Probe method: "default" uses Klipper's normal bed_mesh method.
# To opt in to the fast eddy-current scan set it to "rapid_scan". It is only
# used when your config has a [bed_mesh] section AND a probe listed in
# rapid_scan_probes below (e.g. [probe_eddy_current ...]); otherwise KAMP
# silently falls back to the normal method and says so when verbose.
variable_probe_method: "default"

# Probe section names (prefixes) that support BED_MESH_CALIBRATE METHOD=rapid_scan.
# Remove entries your Klipper build does not support (for example "beacon").
variable_rapid_scan_probes: ["probe_eddy_current", "beacon"]

# Mesh bounds are derived automatically from [bed_mesh] mesh_min / mesh_max
# (or, when those are absent, from the axis limits and the probe offsets).
# Set any of these to a non-zero value to override the automatic bound
# (0 = automatic). These are probe coordinates, like mesh_min / mesh_max.
variable_mesh_min_x: 0.0
variable_mesh_min_y: 0.0
variable_mesh_max_x: 0.0
variable_mesh_max_y: 0.0

# Purge settings
variable_edge_margin: 10.0          # Keep purge/park this far inside the axis limits (mm)
variable_purge_margin: 8.0          # Distance from print bounds for purge line
variable_purge_clearance: 3.0       # Minimum gap between purge line (incl. wipe) and the model
variable_purge_height: 0.35         # Z height for purge line (mm)
variable_purge_length: 30.0         # Length of purge line (mm)
variable_purge_amount: 25.0         # Extrusion distance (mm of filament)
variable_flow_rate: 12.0            # Maximum volumetric flow of the purge (mm3/s)

# Smart Park settings
variable_smart_park_z_hop: 5.0      # Z clearance during pre-heat parking (mm)

gcode:
    # Internal settings container
