# ==============================================================================
# Indus3D KAMP (Klipper Adaptive Meshing & Purging) Configuration
# ==============================================================================
# This configuration adapts bed probing and purge moves to the exact bounding
# box of the current print file, saving time and mechanical wear.
# ==============================================================================

[gcode_macro _KAMP_Settings]
description: Configuration parameters for Indus3D KAMP macros
variable_verbose_enable: True

# Mesh margins (distance to expand mesh outside the printed objects)
variable_mesh_margin: 5.0

# Minimum probe count per axis (small prints)
variable_min_probe_count: 5

# Maximum probe count per axis (large prints)
variable_max_probe_count: 15

# Default probe method: 'rapid_scan' for BTT Eddy probe, or 'default'
variable_probe_method: "rapid_scan"

# Hardware probe reach limits (derived from eddyprobe.cfg)
variable_mesh_min_x: 20.0
variable_mesh_min_y: 5.0
variable_mesh_max_x: 305.0
variable_mesh_max_y: 270.0

# Purge settings
variable_purge_margin: 8.0          # Distance from print bounds for purge line
variable_purge_height: 0.35         # Z height for purge line (mm)
variable_purge_length: 30.0         # Length of purge line (mm)
variable_purge_amount: 25.0         # Extrusion distance (mm of filament)
variable_flow_rate: 12.0            # Volumetric flow rate target (mm3/s)

# Smart Park settings
variable_smart_park_z_hop: 5.0      # Z clearance during pre-heat parking (mm)

gcode:
    # Internal settings container
