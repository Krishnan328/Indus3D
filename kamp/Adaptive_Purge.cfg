# ==============================================================================
# Indus3D Adaptive Line Purge (KAMP)
# ==============================================================================
# Extrudes a targeted purge line next to the printed part.
#
# * variable_flow_rate is a volumetric limit in mm3/s. The XY feedrate of the
#   purge move is derived from it, the filament diameter of [extruder] and
#   the purge amount, so the purge never exceeds the limit.
# * Every XY/Z target is clamped to the printer's axis limits.
# * The line is placed on the front of the model, moved to the rear when it
#   would touch the model, and shortened (or skipped) as a last resort.
# * G-code state (M82/M83, G90/G91, feedrate) is restored on exit.
# ==============================================================================

[gcode_macro LINE_PURGE]
description: Purges filament in a short line adjacent to the print area
gcode:
    {% set kamp = printer["gcode_macro _KAMP_Settings"] %}
    {% set th = printer.toolhead %}
    {% set cf = printer.configfile|default({}) %}
    {% set cfg = cf.settings|default({}) %}
    {% set ex_cfg = cfg.extruder|default({}) %}
    {% set fil_d = ex_cfg.filament_diameter|default(1.75)|float %}

    {% set edge = kamp.edge_margin|default(10.0)|float %}
    {% set clear = kamp.purge_clearance|default(3.0)|float %}
    {% set amin_x = th.axis_minimum.x|float %}
    {% set amax_x = th.axis_maximum.x|float %}
    {% set amin_y = th.axis_minimum.y|float %}
    {% set amax_y = th.axis_maximum.y|float %}
    {% set max_z = th.axis_maximum.z|float %}
    {% set lo_x = amin_x + edge %}
    {% set hi_x = amax_x - edge %}
    {% set lo_y = amin_y + edge %}
    {% set hi_y = amax_y - edge %}

    {% set wipe_dx = 10.0 %}
    {% set wipe_dy = 2.0 %}
    {% set base_len = [[kamp.purge_length|float, hi_x - lo_x] | min, 1.0] | max %}
    {% set purge_z = [kamp.purge_height|float, max_z] | min %}
    {% set hop_z = [purge_z + 2.0, max_z] | min %}
    {% set base_e = kamp.purge_amount|float %}
    {% set flow = [kamp.flow_rate|float, 0.1] | max %}

    {% set all_points = [] %}
    {% if printer.exclude_object is defined and printer.exclude_object.objects %}
        {% for obj in printer.exclude_object.objects %}
            {% for pt in obj.polygon %}
                {% set _ = all_points.append(pt) %}
            {% endfor %}
        {% endfor %}
    {% endif %}

    # ns carries the chosen placement (Jinja scoping)
    {% set ns = namespace(sx=lo_x, y=lo_y, wy=lo_y, length=base_len, ok=True, note="") %}

    {% if all_points|length > 0 %}
        {% set x_vals = all_points | map(attribute=0) | list %}
        {% set y_vals = all_points | map(attribute=1) | list %}
        {% set bx0 = x_vals | min %}
        {% set bx1 = x_vals | max %}
        {% set by0 = y_vals | min %}
        {% set by1 = y_vals | max %}
        {% set ns.sx = [[[bx0 - kamp.purge_margin, lo_x] | max, hi_x - base_len] | min, lo_x] | max %}
        {% set x_end = [ns.sx + base_len + wipe_dx, amax_x] | min %}

        # candidate 1: in front of the model, wipe away from it
        {% set fy = [[by0 - kamp.purge_margin, lo_y] | max, hi_y] | min %}
        {% set fwy = [[fy - wipe_dy, amin_y] | max, amax_y] | min %}
        {% set front_hit = (x_end > bx0 - clear) and (ns.sx < bx1 + clear) and ([fy, fwy] | max > by0 - clear) and ([fy, fwy] | min < by1 + clear) %}
        # candidate 2: behind the model
        {% set ry = [[by1 + kamp.purge_margin, lo_y] | max, hi_y] | min %}
        {% set rwy = [[ry + wipe_dy, amin_y] | max, amax_y] | min %}
        {% set rear_hit = (x_end > bx0 - clear) and (ns.sx < bx1 + clear) and ([ry, rwy] | max > by0 - clear) and ([ry, rwy] | min < by1 + clear) %}

        {% if not front_hit %}
            {% set ns.y = fy %}
            {% set ns.wy = fwy %}
        {% elif not rear_hit %}
            {% set ns.y = ry %}
            {% set ns.wy = rwy %}
            {% set ns.note = "moved behind the model" %}
        {% else %}
            # neither side is clear: keep the front row and stop short of the model
            {% set ns.y = fy %}
            {% set ns.wy = fwy %}
            {% set room = bx0 - clear - wipe_dx - ns.sx %}
            {% if ([fy, fwy] | max > by0 - clear) and ([fy, fwy] | min < by1 + clear) and room < base_len %}
                {% if room >= 5.0 %}
                    {% set ns.length = room %}
                    {% set ns.note = "shortened to stay clear of the model" %}
                {% else %}
                    {% set ns.ok = False %}
                {% endif %}
            {% endif %}
        {% endif %}
    {% else %}
        {% set ns.note = "no object bounds, using the front-left corner" %}
    {% endif %}

    {% set start_x = ns.sx %}
    {% set start_y = ns.y %}
    {% set end_x = ns.sx + ns.length %}
    {% set wipe_x = [end_x + wipe_dx, amax_x] | min %}
    {% set wipe_y = ns.wy %}
    # scale the extrusion with a shortened line so the flow stays the same
    {% set purge_e = base_e * ns.length / base_len %}
    # volumetric limit -> XY feedrate: volume = pi*(d/2)^2*E, time = volume/flow
    {% set volume = 3.14159265 * (fil_d / 2.0) ** 2 * purge_e %}
    {% set feed = [[ns.length * flow * 60.0 / volume if volume > 0 else 6000.0, 6000.0] | min, 1.0] | max %}

    {% if "xyz" not in th.homed_axes %}
        {action_respond_info("Indus3D KAMP: Line purge skipped, axes are not homed")}
    {% elif printer.extruder is defined and printer.extruder.can_extrude is defined and not printer.extruder.can_extrude %}
        {action_respond_info("Indus3D KAMP: Line purge skipped, the extruder is too cold to extrude")}
    {% elif not ns.ok %}
        {action_respond_info("Indus3D KAMP: Line purge skipped, no room beside the model")}
    {% else %}
        {% if kamp.verbose_enable %}
            {action_respond_info("Indus3D KAMP: Purging at X=%.1f->%.1f, Y=%.1f, Z=%.2f, %.1f mm3/s max%s" % (start_x, end_x, start_y, purge_z, flow, (" (" ~ ns.note ~ ")") if ns.note else ""))}
        {% endif %}
        SAVE_GCODE_STATE NAME=_LINE_PURGE
        G90
        G1 Z{[th.position.z|float, hop_z] | max} F3000
        G1 X{start_x} Y{start_y} F6000
        G1 Z{purge_z} F1500
        G92 E0
        M83
        # extrude the purge line
        G1 X{end_x} Y{start_y} E{purge_e} F{feed}
        # rapid wipe move to break stringing, away from the model
        G1 X{wipe_x} Y{wipe_y} Z{[purge_z + 0.5, max_z] | min} F9000
        G92 E0
        RESTORE_GCODE_STATE NAME=_LINE_PURGE
    {% endif %}
