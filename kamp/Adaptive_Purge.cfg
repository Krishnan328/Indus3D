# ==============================================================================
# Indus3D Adaptive Line Purge (KAMP)
# ==============================================================================
# Extrudes a targeted purge line directly adjacent to the printed part.
# ==============================================================================

[gcode_macro LINE_PURGE]
description: Purges filament in a short line adjacent to the print area
gcode:
    {% set kamp = printer["gcode_macro _KAMP_Settings"] %}
    {% set all_points = [] %}
    
    {% if printer.exclude_object is defined and printer.exclude_object.objects %}
        {% for obj in printer.exclude_object.objects %}
            {% for pt in obj.polygon %}
                {% set _ = all_points.append(pt) %}
            {% endfor %}
        {% endfor %}
    {% endif %}

    {% if all_points|length > 0 %}
        {% set x_vals = all_points | map(attribute=0) | list %}
        {% set y_vals = all_points | map(attribute=1) | list %}
        {% set start_x = [((x_vals | min) - kamp.purge_margin), 10.0] | max %}
        {% set start_y = [((y_vals | min) - kamp.purge_margin), 10.0] | max %}
    {% else %}
        {% set start_x = 10.0 %}
        {% set start_y = 10.0 %}
    {% endif %}

    {% set purge_len = kamp.purge_length %}
    {% set end_x = start_x + purge_len %}
    {% set purge_z = kamp.purge_height %}
    {% set purge_e = kamp.purge_amount %}

    {% if kamp.verbose_enable %}
        {action_respond_info("Indus3D KAMP: Purging at X=%.1f->%.1f, Y=%.1f, Z=%.2f" % (start_x, end_x, start_y, purge_z))}
    {% endif %}

    G90
    # Move to start position
    G1 X{start_x} Y{start_y} Z{purge_z + 2.0} F6000
    G1 Z{purge_z} F1500

    # Reset extruder
    G92 E0
    M83

    # Extrude purge line
    G1 X{end_x} Y{start_y} E{purge_e} F{kamp.flow_rate * 60}
    
    # Rapid wipe move to break stringing
    G1 X{end_x + 10.0} Y{start_y + 2.0} Z{purge_z + 0.5} F9000
    G92 E0
