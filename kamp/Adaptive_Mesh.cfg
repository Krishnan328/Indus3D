# ==============================================================================
# Indus3D Adaptive Bed Mesh (KAMP)
# ==============================================================================
# Dynamically restricts bed mesh probing to the bounding box of printed objects.
# ==============================================================================

[gcode_macro BED_MESH_CALIBRATE]
rename_existing: _BED_MESH_CALIBRATE_BASE
description: Adaptive bed mesh calibration restricted to sliced object bounds
gcode:
    {% set kamp = printer["gcode_macro _KAMP_Settings"] %}
    {% set all_points = [] %}
    
    # Check if exclude_object is active and contains objects
    {% if printer.exclude_object is defined and printer.exclude_object.objects %}
        {% for obj in printer.exclude_object.objects %}
            {% for pt in obj.polygon %}
                {% set _ = all_points.append(pt) %}
            {% endfor %}
        {% endfor %}
    {% endif %}

    {% if all_points|length > 0 %}
        # Compute bounding box
        {% set x_vals = all_points | map(attribute=0) | list %}
        {% set y_vals = all_points | map(attribute=1) | list %}
        
        {% set min_x = (x_vals | min) - kamp.mesh_margin %}
        {% set max_x = (x_vals | max) + kamp.mesh_margin %}
        {% set min_y = (y_vals | min) - kamp.mesh_margin %}
        {% set max_y = (y_vals | max) + kamp.mesh_margin %}
        
        # Clamp to hardware limits reachable by the probe
        {% set safe_min_x = [min_x, kamp.mesh_min_x] | max %}
        {% set safe_max_x = [max_x, kamp.mesh_max_x] | min %}
        {% set safe_min_y = [min_y, kamp.mesh_min_y] | max %}
        {% set safe_max_y = [max_y, kamp.mesh_max_y] | min %}
        
        # Ensure valid area dimensions
        {% if safe_max_x <= safe_min_x %}
            {% set safe_min_x = kamp.mesh_min_x %}
            {% set safe_max_x = kamp.mesh_max_x %}
        {% endif %}
        {% if safe_max_y <= safe_min_y %}
            {% set safe_min_y = kamp.mesh_min_y %}
            {% set safe_max_y = kamp.mesh_max_y %}
        {% endif %}

        # Dynamically scale probe points based on print dimensions
        {% set width = safe_max_x - safe_min_x %}
        {% set height = safe_max_y - safe_min_y %}
        {% set points_x = [((width / 25) | round(0, 'ceil') | int), kamp.min_probe_count] | max %}
        {% set points_x = [points_x, kamp.max_probe_count] | min %}
        {% set points_y = [((height / 25) | round(0, 'ceil') | int), kamp.min_probe_count] | max %}
        {% set points_y = [points_y, kamp.max_probe_count] | min %}

        {% if kamp.verbose_enable %}
            {action_respond_info("Indus3D KAMP: Adaptive Mesh [%.1f, %.1f] to [%.1f, %.1f] with %dx%d points" % (safe_min_x, safe_min_y, safe_max_x, safe_max_y, points_x, points_y))}
        {% endif %}

        # Check if BTT Eddy rapid_scan method is requested/available
        {% if kamp.probe_method == "rapid_scan" or params.METHOD == "rapid_scan" %}
            _BED_MESH_CALIBRATE_BASE METHOD=rapid_scan MESH_MIN={safe_min_x},{safe_min_y} MESH_MAX={safe_max_x},{safe_max_y} PROBE_COUNT={points_x},{points_y} {rawparams}
        {% else %}
            _BED_MESH_CALIBRATE_BASE MESH_MIN={safe_min_x},{safe_min_y} MESH_MAX={safe_max_x},{safe_max_y} PROBE_COUNT={points_x},{points_y} {rawparams}
        {% endif %}

    {% else %}
        {% if kamp.verbose_enable %}
            {action_respond_info("Indus3D KAMP: No object bounds detected. Performing standard mesh.")}
        {% endif %}
        _BED_MESH_CALIBRATE_BASE {rawparams}
    {% endif %}
