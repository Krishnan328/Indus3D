# ==============================================================================
# Indus3D Adaptive Bed Mesh (KAMP)
# ==============================================================================
# Dynamically restricts bed mesh probing to the bounding box of printed objects.
#
# Mesh limits come from your own [bed_mesh] mesh_min / mesh_max. If those are
# missing they are derived from the axis limits and the probe offsets. The
# optional mesh_min_x/... variables in KAMP_Settings.cfg override them.
# ==============================================================================

[gcode_macro BED_MESH_CALIBRATE]
rename_existing: _BED_MESH_CALIBRATE_BASE
description: Adaptive bed mesh calibration restricted to sliced object bounds
gcode:
    {% set kamp = printer["gcode_macro _KAMP_Settings"] %}
    {% set th = printer.toolhead %}
    {% set cf = printer.configfile|default({}) %}
    {% set cfg = cf.settings|default({}) %}
    {% set raw_cfg = cf.config|default({}) %}
    {% set bm = cfg.bed_mesh|default({}) %}

    # --- probe offsets (probe position = nozzle position + offset) ---
    {% set ns = namespace(ox=0.0, oy=0.0, rapid_probe=False) %}
    {% for sec in cfg %}
        {% if sec == "probe" or sec.startswith("probe_eddy_current ") or sec == "beacon" %}
            {% set s = cfg[sec] %}
            {% if s.x_offset is defined %}{% set ns.ox = s.x_offset|float %}{% endif %}
            {% if s.y_offset is defined %}{% set ns.oy = s.y_offset|float %}{% endif %}
        {% endif %}
    {% endfor %}
    {% for sec in raw_cfg %}
        {% for p in kamp.rapid_scan_probes|default([]) %}
            {% if sec == p or sec.startswith(p ~ " ") %}{% set ns.rapid_probe = True %}{% endif %}
        {% endfor %}
    {% endfor %}
    {% set rapid_ok = ns.rapid_probe and (bm.mesh_min is defined or raw_cfg.bed_mesh is defined) %}

    # --- mesh limits: override > [bed_mesh] > axis limits + probe offsets ---
    {% set cfg_min_x = bm.mesh_min[0]|float if bm.mesh_min is defined else th.axis_minimum.x|float + ns.ox %}
    {% set cfg_min_y = bm.mesh_min[1]|float if bm.mesh_min is defined else th.axis_minimum.y|float + ns.oy %}
    {% set cfg_max_x = bm.mesh_max[0]|float if bm.mesh_max is defined else th.axis_maximum.x|float + ns.ox %}
    {% set cfg_max_y = bm.mesh_max[1]|float if bm.mesh_max is defined else th.axis_maximum.y|float + ns.oy %}
    {% set lim_min_x = kamp.mesh_min_x|float if kamp.mesh_min_x else cfg_min_x %}
    {% set lim_min_y = kamp.mesh_min_y|float if kamp.mesh_min_y else cfg_min_y %}
    {% set lim_max_x = kamp.mesh_max_x|float if kamp.mesh_max_x else cfg_max_x %}
    {% set lim_max_y = kamp.mesh_max_y|float if kamp.mesh_max_y else cfg_max_y %}

    # --- METHOD handling: honour a request only if the printer supports it ---
    {% set requested = (params.METHOD if params.METHOD is defined else kamp.probe_method|default("default"))|string|lower %}
    {% set method_arg = "" %}
    {% if requested == "rapid_scan" %}
        {% if rapid_ok %}
            {% set method_arg = "METHOD=rapid_scan" %}
        {% elif kamp.verbose_enable %}
            {action_respond_info("Indus3D KAMP: rapid_scan is not supported by this printer config, using the normal mesh method")}
        {% endif %}
    {% elif params.METHOD is defined %}
        {% set method_arg = "METHOD=" ~ params.METHOD %}
    {% endif %}

    # pass the user's own parameters through, minus METHOD (handled above)
    {% set extra = [] %}
    {% for tok in rawparams.split() %}
        {% if not tok.upper().startswith("METHOD=") %}{% set _ = extra.append(tok) %}{% endif %}
    {% endfor %}
    {% set extra_arg = extra | join(" ") %}

    {% set all_points = [] %}
    {% if printer.exclude_object is defined and printer.exclude_object.objects %}
        {% for obj in printer.exclude_object.objects %}
            {% for pt in obj.polygon %}
                {% set _ = all_points.append(pt) %}
            {% endfor %}
        {% endfor %}
    {% endif %}

    {% if all_points|length > 0 %}
        {% set x_vals = all_points | map(attribute=0) | list %}
        {% set y_vals = all_points | map(attribute=1) | list %}

        # object bounds in probe coordinates, plus margin
        {% set min_x = (x_vals | min) + ns.ox - kamp.mesh_margin %}
        {% set max_x = (x_vals | max) + ns.ox + kamp.mesh_margin %}
        {% set min_y = (y_vals | min) + ns.oy - kamp.mesh_margin %}
        {% set max_y = (y_vals | max) + ns.oy + kamp.mesh_margin %}

        # clamp to the area the probe can reach
        {% set safe_min_x = [min_x, lim_min_x] | max %}
        {% set safe_max_x = [max_x, lim_max_x] | min %}
        {% set safe_min_y = [min_y, lim_min_y] | max %}
        {% set safe_max_y = [max_y, lim_max_y] | min %}

        # object entirely outside the reachable area: use the full mesh area
        {% if safe_max_x <= safe_min_x %}
            {% set safe_min_x = lim_min_x %}
            {% set safe_max_x = lim_max_x %}
        {% endif %}
        {% if safe_max_y <= safe_min_y %}
            {% set safe_min_y = lim_min_y %}
            {% set safe_max_y = lim_max_y %}
        {% endif %}

        # scale the probe count with the area
        {% set width = safe_max_x - safe_min_x %}
        {% set height = safe_max_y - safe_min_y %}
        {% set points_x = [((width / 25) | round(0, 'ceil') | int), kamp.min_probe_count] | max %}
        {% set points_x = [points_x, kamp.max_probe_count] | min %}
        {% set points_y = [((height / 25) | round(0, 'ceil') | int), kamp.min_probe_count] | max %}
        {% set points_y = [points_y, kamp.max_probe_count] | min %}

        {% if kamp.verbose_enable %}
            {action_respond_info("Indus3D KAMP: Adaptive Mesh [%.1f, %.1f] to [%.1f, %.1f] with %dx%d points" % (safe_min_x, safe_min_y, safe_max_x, safe_max_y, points_x, points_y))}
        {% endif %}

        _BED_MESH_CALIBRATE_BASE {method_arg} MESH_MIN={safe_min_x},{safe_min_y} MESH_MAX={safe_max_x},{safe_max_y} PROBE_COUNT={points_x},{points_y} {extra_arg}
    {% else %}
        {% if kamp.verbose_enable %}
            {action_respond_info("Indus3D KAMP: No object bounds detected. Performing standard full-bed mesh.")}
        {% endif %}
        _BED_MESH_CALIBRATE_BASE {method_arg} {extra_arg}
    {% endif %}
