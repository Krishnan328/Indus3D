# indus_sim_ender3.cfg
# ---------------------
# Simulated Creality Ender 3 profile for Indus3D offline testing.
# Place in backend/config/ and run: python main.py --sim --profile indus_sim_ender3.cfg

[indus3d]
moonraker_ip            = 127.0.0.1
moonraker_port          = 7125
lag_magnitude_warn_mm   = 0.5
stress_score_warn       = 0.3
ext_heat_cycles_warn    = 300
bed_heat_cycles_warn    = 300
thermal_runaway_delta_c = 12.0
thermal_runaway_window_s = 4.0
layer_height_mm         = 0.2
line_width_mm           = 0.4
linear_advance_k        = 0.06
max_volumetric_flow_mm3s = 10.0

[printer]
kinematics = cartesian
max_velocity = 200
max_accel = 1500
name = Creality Ender 3

[stepper_x]
rotation_distance       = 40
full_steps_per_rotation = 200
microsteps              = 16
position_max            = 235

[stepper_y]
rotation_distance       = 40
full_steps_per_rotation = 200
microsteps              = 16
position_max            = 235

[stepper_z]
rotation_distance       = 8
full_steps_per_rotation = 200
microsteps              = 16
position_max            = 250

[extruder]
nozzle_diameter     = 0.4
filament_diameter   = 1.75
max_temp            = 260
pid_Kp              = 21.527
pid_Ki              = 1.063
pid_Kd              = 108.982
rotation_distance   = 33.683
full_steps_per_rotation = 200
microsteps          = 16

[heater_bed]
max_temp = 110
pid_Kp   = 54.027
pid_Ki   = 0.770
pid_Kd   = 948.182
