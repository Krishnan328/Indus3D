# indus_overrides.cfg
# ---------------------
# Place in backend/config/ alongside printer_profile.json
# Only put things here that Klipper doesn't know about.
#
# The Moonraker address is NOT set here — it lives in backend/.env
# (MOONRAKER_HOST / MOONRAKER_PORT), read via config/settings.py.
# It used to also be read from this file, which meant two independent
# config sources could silently disagree. Fixed — see CLAUDE_CONTEXT.md.

[indus3d]
# Alert thresholds
lag_magnitude_warn_mm    = 0.8
stress_score_warn        = 0.5
ext_heat_cycles_warn     = 500
bed_heat_cycles_warn     = 500
thermal_runaway_delta_c  = 15.0
thermal_runaway_window_s = 5.0

# Print geometry defaults (slicer overrides per print)
layer_height_mm           = 0.2
line_width_mm             = 0.4
linear_advance_k          = 0.04
max_volumetric_flow_mm3s  = 12.0

# ── Variable input shaping baseline ──────────────────────────────────────────
# Measure these once with an empty bed using Klipper's SHAPER_CALIBRATE macro.
# Run: ADXL_TEST AXIS=Y  then paste the resonant frequency here.
# bed_mass_g: weigh your heated bed assembly (aluminium + glass/PEI + carriage).
#
# Leave at 0 to disable variable input shaping.
y_resonance_hz  = 0.0
bed_mass_g      = 0.0
y_shaper_type   = mzv

# ── Thermal runaway → physical power cutoff (optional, off by default) ──────
# When enabled, a detected thermal runaway sends M112 (as before) AND cuts
# power to the named Moonraker [power <device>] device — e.g. an ESP8266-
# controlled relay on the printer's PSU. This is NOT redundant with M112:
# M112 depends on Klipper/the MCU still being able to respond. A physically
# stuck heater MOSFET (the classic thermal-runaway hardware failure) can
# keep heating even after Klipper shuts down — a separate relay circuit
# can still cut it.
#
# REQUIRED before enabling: the target device's moonraker.conf entry must
# NOT set locked_while_printing: True, or Moonraker will silently refuse
# the cutoff — during a print, which is exactly when this fires.
power_cutoff_enabled = false
power_cutoff_device  =

# ── Timelapse (optional, off by default) ─────────────────────────────────────
# "interval": snapshot every timelapse_interval_s seconds while printing —
#   works with any slicer, no gcode macros needed.
# "layer": snapshot on each Z increase, using Indus3D's own live Z tracking
#   instead of slicer layer-change macros — also needs no gcode preprocessing.
# Requires ffmpeg installed on the Pi (apt install ffmpeg) to stitch frames
# into an mp4 on print completion. See docs/DEVELOPMENT.md.
timelapse_enabled    = false
timelapse_mode       = interval
timelapse_interval_s = 10
timelapse_fps        = 15

edge_inspection_enabled       = false
edge_inspection_threshold_pct = 70
edge_inspection_cooldown_s    = 120
