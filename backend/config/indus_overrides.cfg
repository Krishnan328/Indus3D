# indus_overrides.cfg
# ---------------------
# Place in backend/config/ alongside printer_profile.json
# Only put things here that Klipper doesn't know about.

[indus3d]
# Moonraker connection
moonraker_ip    = 127.0.0.1
moonraker_port  = 7125

# Alert thresholds
lag_magnitude_warn_mm    = 0.8
stress_score_warn        = 0.5
ext_heat_cycles_warn     = 500
bed_heat_cycles_warn     = 500
thermal_runaway_delta_c  = 15.0
thermal_runaway_window_s = 5.0

# Print geometry defaults (slicer overrides per print)
layer_height_mm           = 0.2
line_width_mm             = 0.4
linear_advance_k          = 0.04
max_volumetric_flow_mm3s  = 12.0

# ── Variable input shaping baseline ──────────────────────────────────────────
# Measure these once with an empty bed using Klipper's SHAPER_CALIBRATE macro.
# Run: ADXL_TEST AXIS=Y  then paste the resonant frequency here.
# bed_mass_g: weigh your heated bed assembly (aluminium + glass/PEI + carriage).
#
# Leave at 0 to disable variable input shaping.
y_resonance_hz  = 0.0
bed_mass_g      = 0.0
y_shaper_type   = mzv
