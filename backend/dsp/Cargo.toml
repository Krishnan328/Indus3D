[package]
name = "indus3d-dsp"
version = "0.2.0"
edition = "2021"
description = "High-speed ADXL accelerometer DSP pipeline for Indus3D — collision detection, vibration spectral analysis, and shaper calibration"

[[bin]]
name = "indus3d-dsp"
path = "src/main.rs"

[dependencies]
rustfft  = "6.1"
ndarray  = "0.15"
serde    = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
byteorder  = "1.5"          # zero-copy binary packet parsing (Step 2)
clap       = { version = "4.5", features = ["derive"] }  # CLI resonance analyser (Step 3)
