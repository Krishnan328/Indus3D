name: Bug report
description: Report a reproducible problem in Indus3D.
title: "[Bug]: "
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Do not include API keys, private IP addresses, Tailscale names, or camera URLs.
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Simulator
        - Real Klipper printer
        - Both
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Indus3D version or commit
      placeholder: e.g. 1a2b3c4
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: Tell us exactly what you did and what you expected.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant redacted logs or screenshots
      description: Remove credentials, network addresses, and camera stream URLs.
