name: Secret checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false
      - name: Install pinned Gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.24.2
      - name: Scan published history without exposing values
        run: gitleaks git --redact --no-banner --log-opts="--all"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test the scanner's positive and negative controls
        run: python tools/security/test_secret_scanning.py
